<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MicroMorph — Innovation Slide (4:3)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --shell: linear-gradient(145deg, #f3f8f1 0%, #e7f0e4 52%, #d8e4d4 100%);
      --frame: rgba(98, 132, 94, 0.18);
      --text: #111111;
      --muted: #5b6658;
      --shadow: -10px -10px 24px rgba(255,255,255,0.75), 16px 16px 36px rgba(88, 104, 84, 0.12);
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--shell);
      color: var(--text);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 14% 10%, rgba(255,255,255,0.7), transparent 32%),
        radial-gradient(circle at 84% 18%, rgba(122,156,120,0.18), transparent 28%),
        radial-gradient(circle at 16% 82%, rgba(124,160,118,0.10), transparent 24%);
      pointer-events: none;
    }

    .viewport {
      position: relative;
      width: 1024px;
      height: 768px;
      margin: 0 auto;
      overflow: hidden;
      border-left: 1px solid var(--frame);
      border-right: 1px solid var(--frame);
      box-shadow: var(--shadow);
      background: rgba(246, 250, 244, 0.72);
    }

    .slide-frame {
      position: absolute;
      top: 84px;
      left: 0;
      width: 1400px;
      height: 820px;
      border: 0;
      transform: scale(0.7314285714);
      transform-origin: top left;
      background: transparent;
    }

    .badge {
      position: absolute;
      top: 16px;
      left: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid rgba(98, 132, 94, 0.22);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 8px 22px rgba(0,0,0,0.06);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      z-index: 2;
      user-select: none;
    }

    .badge strong {
      color: var(--text);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="badge"><strong>MicroMorph</strong> 4:3 presentation</div>
    <iframe class="slide-frame" src="presentation-slide.html" title="MicroMorph presentation slide 4:3"></iframe>
  </div>
</body>
</html>
